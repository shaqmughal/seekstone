# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review config (SHA-522, SHA-569). The path instructions below
# are the rules a generic reviewer wouldn't know; the files listed under
# knowledge_base.code_guidelines are read as review rules too.
#
# CodeRabbit is a merge gate here: it requests changes for findings and
# approves only when none are left open, and the required `review gate` check
# (.github/workflows/review-gate.yml) passes only on that approval. See
# docs/QUALITY-GATES.md.

language: en-US

reviews:
  profile: assertive
  # Request changes for actionable findings; approve once the threads are
  # resolved, the latest commit is reviewed and the pre-merge checks pass.
  # Every actionable finding blocks, whatever its severity.
  auto_approvals:
    enabled: true
    # A skipped review (draft, file limit) reviewed nothing, so it approves
    # nothing.
    approve_on_skipped_review: false
    # `@coderabbitai approve` from the PR's own author would skip the review.
    allow_author_approval: false
  # A review that stops on an error shows as failed, not as success.
  fail_commit_status: true
  merge_risk_instructions: |
    Highest risk: anything that can lose or corrupt a user's vault or undo
    history. That is packages/server/src/journal.ts, atomic-write.ts,
    policy.ts, audit.ts, vault-path.ts and the write tools in
    packages/server/src/tools/ (create, append, patch, move, delete, rename,
    rewrite links, frontmatter). Also high: changes to the release pipeline
    (.github/workflows/release.yml, scripts/publish-*.mjs, server.json) and to
    the required checks themselves (.github/workflows/, scripts/quality-rules.mjs,
    scripts/review-gate.mjs, .coderabbit.yaml).
    Moderate: read and search tools, the index, link resolution and other hot
    paths, where a slowdown breaks the project's main claim, and tool, prompt
    or resource descriptions, which cost context in every session.
    Low: docs, tests that only add cases, harness reports and fixtures.
  security_risk_instructions: |
    Seekstone runs locally over stdio as the user who started it. It has no
    network listener and makes no network calls on the serving path
    (no-network.test.ts guards this). Its trust boundary is the vault: every
    path from a tool call is untrusted and must go through resolveVaultPath,
    which keeps it inside the vault and applies SEEKSTONE_READ_PATHS;
    writes also need assertWritable (SEEKSTONE_WRITE_PATHS, read-only mode).
    Path traversal, symlink escapes and policy bypasses are the highest risk.
    CI workflows hold the release and factory app secrets; pull_request_target
    or workflow_run jobs that run PR code are high risk.
  # Keep the PR description as the author wrote it; the summary goes in the
  # walkthrough comment instead.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  suggested_reviewers: false
  auto_apply_labels: false
  auto_review:
    enabled: true
    # Factory PRs start as drafts while CI runs; reviewing them then means
    # the findings are in by the time the PR is marked ready.
    drafts: true
    # The default pauses reviews after 5 reviewed commits. The review gate
    # needs a review of the latest commit, so reviews never pause.
    auto_pause_after_reviewed_commits: 0
    base_branches: ['main']
  # Nothing pushes commits to a PR branch without a person asking for it.
  finishing_touches:
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    simplify:
      enabled: false

  path_filters:
    - '!**/package-lock.json'
    - '!**/CHANGELOG.md'
    - '!**/dist/**'
    - '!**/coverage/**'
    - '!packages/harness/fixtures/vault/**'
    - '!packages/harness/fixtures/vault-1k/**'
    - '!packages/harness/fixtures/vault-5k/**'
    - '!packages/harness/fixtures/corpus/**'
    - '!packages/harness/fixtures/models/**'
    - '!packages/harness/fixtures/baseline-reports/**'
    - '!reports/**'
    - '!benchmarks.json'
    - '!mcp-publisher'
    - '!**/*.mcpb'
    - '!**/*.gif'
    - '!**/*.png'

  path_instructions:
    - path: 'packages/server/src/tools/**/*.ts'
      instructions: |
        Seekstone's MCP tools. Check these rules, which the type checker won't catch:
        - Every file read by path goes through `resolveVaultPath` (vault-path.ts),
          so `SEEKSTONE_READ_PATHS` hides files consistently. Flag direct `fs`
          reads of a joined vault path. `path-guard.test.ts` enforces this; a new
          tool that reads files must be covered by it.
        - Write tools call `assertWritable` (policy.ts) before resolving the path.
        - Write tools journal the pre-image before the first vault byte changes:
          `journalWrite` for one file, or `ctx.journal.begin()` for several (work
          out every rewrite first, journal them under one `seq`, then write). A
          write that happens before the journal entry breaks `undo_write`.
        - Writes go through `atomicWrite`, never a bare `writeFile` on a vault path.
        - Write tools support optional `prevHash` compare-and-swap and return a
          `contentHash` in the result.
        - Deletes move to `.trash/`; moves rewrite inbound links.
        - Nothing on the serving path makes a network call.
        - Input schemas and their `.describe()` text are part of the schema tax.
          Changing them needs the regenerated baseline described for
          `tool-list.ts`.
    - path: 'packages/server/src/dispatch.ts'
      instructions: |
        A new write tool's dispatch case must return an `audit` detail object
        (paths and counts only, never note content), or its calls are not
        recorded when `SEEKSTONE_AUDIT_FILE` is set. Flag any audit detail that
        includes note text or frontmatter values.
    - path: 'packages/server/src/{tool-list,instructions}.ts'
      instructions: |
        Changes to tool, prompt or resource names, descriptions or schemas cost
        context in every session. A new tool, prompt or resource needs the
        admission-bar artifacts in the same PR: a task in
        `packages/harness/queries/tasks.json` that shows a token win, and a
        regenerated schema-tax baseline in
        `packages/harness/fixtures/baseline-reports` plus `benchmarks.json`.
        Even a one-word description change needs the regenerated baseline, or
        CI's `schema-tax --check` fails. Point out wordy descriptions; every
        token counts here.
    - path: 'packages/server/src/{journal,atomic-write,audit,policy}.ts'
      instructions: |
        The write-safety core (docs/WRITE-SAFETY.md). Treat any of these as a
        Major finding, and losing or corrupting undo history as Major even
        when the vault write itself succeeds:
        - Crash consistency: a crash or kill at any point leaves either the old
          or the new file, never a mix. Data is fsynced before the rename that
          publishes it, and the journal entry is durable before the vault file
          changes.
        - Short writes: a partial write, ENOSPC or EIO must fail the operation
          and leave no truncated file or half-written journal record behind.
        - Concurrent processes: two server processes on one vault share the
          journal. The manifest lock in journal.ts must be held for every
          read-modify-write of shared state; temp file names must be unique per
          process and write; a stale lock is taken over safely; nothing assumes
          it is the only writer.
        - Windows: rename over an existing file can fail with EPERM or EBUSY
          when another process has it open, and fsync on a directory is not
          supported. Check for a retry or fallback and that errors are not
          swallowed.
        - Policy: assertWritable runs before any path is resolved or touched.
          The audit log records paths and counts only, never note content.
    - path: 'packages/{server,core,harness}/src/**/*.ts'
      instructions: |
        - Relative imports use `.js` extensions, even for TypeScript sources
          (NodeNext). Flag `.ts` extensions and extensionless relative imports.
        - Speed is the project's main claim. Flag work added to hot paths (index
          build, search, read, link resolution, writes): extra passes over all
          notes, repeated parsing, sync I/O in loops, or new dependencies. A new
          hot path should get a case in `packages/server/src/bench/`.
        - Tests are co-located `*.test.ts` files. Behavior changes need a test.
    - path: '**/*.test.ts'
      instructions: |
        Tests must not touch a real vault; they use temp copies or fixtures.
        Flag `.skip`, `.only` and `.todo`, removed assertions, and loosened
        expectations. Tests that depend on timing or ordering of file-system
        events are likely to be flaky on Windows.
    - path: '.changeset/*.md'
      instructions: |
        Only the `seekstone` package may be named; `@seekstone/core` and
        `@seekstone/harness` are private. The summary is a user-facing changelog
        line in plain language.
    - path: '.github/workflows/*.yml'
      instructions: |
        Actions are pinned to a full commit SHA with a version comment. Each job
        starts with the Harden-Runner step. Permissions are least-privilege at
        job level, and checkouts set `persist-credentials: false`. Untrusted
        values (PR titles, branch names, file names) go through `env:`, never
        straight into `run:` with `${{ }}`.
        GitHub runs a PR's own copy of its workflows, so a PR can loosen a
        required check by editing its job. Any change that makes a required
        check (`review gate`, `quality rules`, the `test` and `flaky check`
        jobs, `changeset check`) pass in more cases is a Major finding that
        needs a stated reason in the PR.

  # Failing checks in `error` mode withhold CodeRabbit's approval, and with it
  # the review gate. Each check passes when it does not apply.
  pre_merge_checks:
    # Only a maintainer, not the PR's author, can waive a failing check.
    override_requested_reviewers_only: true
    title:
      mode: error
      requirements: |
        Conventional-commit style: `type(scope): summary` or `type: summary`.
        type is one of feat, fix, perf, refactor, docs, test, ci, build,
        chore or revert. The summary is imperative ("add", not "added" or
        "adds"), starts with a lower-case word, and has no trailing period.
        Names, product names and code identifiers keep their own case
        (CodeRabbit, PRs, atomicWrite, `vault_stats`). A Linear ticket ID such
        as (SHA-123) may follow the summary.
    description:
      mode: warning
    # PRs name a Linear ticket (SHA-123) in the title or description.
    issue_assessment:
      mode: error
    custom_checks:
      - name: Write safety
        mode: error
        instructions: |
          Applies only when the PR changes a non-test file under
          packages/server/src/ that writes, moves or deletes vault files or
          journal state: journal.ts, atomic-write.ts, policy.ts, audit.ts,
          dispatch.ts, or a write tool in packages/server/src/tools/. Pass
          when no such file changed.
          Otherwise fail if any of these is true of the changed code:
          1. A vault file changes before its pre-image is journaled
             (journalWrite, or ctx.journal.begin() for several files).
          2. A vault file is written with anything other than atomicWrite
             (for example a bare fs.writeFile, appendFile or createWriteStream
             on a vault path).
          3. A write path is resolved or touched before assertWritable runs.
          4. Crash safety is weakened: data is not fsynced before the rename
             that publishes it, or a failed or partial write can leave a
             truncated file or journal record.
          5. Multi-process safety is weakened: shared journal state is changed
             without the manifest lock, or a temp file path can be shared by
             two processes or two concurrent writes.
          Pass when none of these is true.
      - name: Admission bar
        mode: error
        instructions: |
          Applies only when the PR adds a new MCP tool, prompt or resource:
          a new name registered in packages/server/src/tool-list.ts or
          packages/server/src/instructions.ts, or a new file in
          packages/server/src/tools/ that is registered as a tool. Pass when
          the PR adds none.
          Otherwise pass only if the same PR adds a task for it to
          packages/harness/queries/tasks.json that measures its token cost
          against the calls it replaces. Fail if no such task is added.
          The regenerated schema-tax baseline is not checked here: CI's
          `schema-tax --check` fails any PR whose served tool list differs
          from the committed baseline.

  # Linters and scanners that cover files in this repo. They are on by
  # default; listing them keeps them on if a default changes.
  tools:
    biome:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    semgrep:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true

  # Flags low-effort PRs from people outside the repo.
  slop_detection:
    enabled: true
    label: slop

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - '**/CLAUDE.md'
      - '**/AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/WRITE-SAFETY.md'
      - 'docs/QUALITY-GATES.md'
  learnings:
    scope: local
  # `auto` turns Linear off for public repos, and this one is public. The
  # linked-issue check needs it on.
  linear:
    usage: enabled
    team_keys: ['SHA']
