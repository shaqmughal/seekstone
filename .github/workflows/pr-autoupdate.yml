name: PR auto-update

# `main` requires a PR to be up to date before it merges, so each merge puts
# every other approved PR behind. A maintainer approves a PR by turning on
# auto-merge. This workflow then updates one approved PR at a time: it brings
# the oldest one up to date, CI runs, auto-merge merges it, and that push to
# main starts the next round. See scripts/factory/autoupdate.mjs and
# docs/QUALITY-GATES.md.

on:
  push:
    branches: [main]
  # Starts the queue when auto-merge is turned on, or when a label comes off
  # (removing `needs-rebase` puts a PR back in line), without waiting for the
  # next push to main. This event runs in the context of main and never
  # checks out or runs code from the PR.
  pull_request_target:
    types: [auto_merge_enabled, unlabeled]
  # A finished check run can change the picture either way: the PR in flight
  # failed (skip it, start the next), or a skipped PR got a passing fix (put
  # it back in line). Each run is a few API reads when nothing changed.
  workflow_run:
    workflows: [CI, CodeQL, CodSpeed, Quality rules, Review gate]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-autoupdate
  cancel-in-progress: false

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    environment: factory
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: write # start the next round after skipping a conflicted PR
    steps:
      - name: Harden runner (audit network egress, SHA-517)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Decide
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/factory/autoupdate.mjs

      # The update goes through the factory app: a commit pushed with the
      # default token doesn't start CI, so the PR would never go green.
      - name: Mint factory app token
        if: steps.decide.outputs.action == 'update'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      - name: Update the PR branch
        if: steps.decide.outputs.action == 'update'
        env:
          PR: ${{ steps.decide.outputs.pr }}
          SHA: ${{ steps.decide.outputs.sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_TOKEN: ${{ github.token }}
        run: |
          if out=$(gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/update-branch" -f expected_head_sha="$SHA" 2>&1); then
            echo "Updated #$PR: $out"
            exit 0
          fi
          echo "$out"
          if echo "$out" | grep -qi 'expected head sha'; then
            echo "::notice::#$PR got a new commit since this run looked; the next run picks it up."
            exit 0
          fi
          if echo "$out" | grep -qi 'conflict'; then
            gh label create needs-rebase --repo "$GITHUB_REPOSITORY" --color FBCA04 \
              --description 'Conflicts with main; the auto-update skips it until this label is removed' 2>/dev/null || true
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-rebase
            printf '%s\n\n%s\n' \
              'This PR conflicts with `main`, so the auto-update can'\''t bring it up to date.' \
              'Resolve the conflict on the branch, then remove the `needs-rebase` label to put it back in the queue.' \
              > "$RUNNER_TEMP/conflict.md"
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/conflict.md"
            # Move on to the next PR straight away instead of waiting for another push to main.
            GH_TOKEN="$DISPATCH_TOKEN" gh workflow run pr-autoupdate.yml --repo "$GITHUB_REPOSITORY" --ref main
            exit 0
          fi
          exit 1
