name: CodSpeed

# Speed gate (SHA-518). Runs the server's hot-path benchmarks under CPU
# simulation, which counts instructions instead of timing them, so results
# are stable on shared runners. CodSpeed compares each PR with main and
# reports regressions as a check. Public repo: authenticates via OIDC, no token.

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed backfill baseline data for earlier commits.
  workflow_dispatch:

permissions: read-all

jobs:
  benchmarks:
    name: CodSpeed benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC authentication with CodSpeed
    steps:
      - name: Harden runner (audit network egress, SHA-517)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          working-directory: packages/server
          run: npx vitest bench --run
