# Tests how the factory isolates its agent (SHA-660): scripts/factory/
# sandbox.sh against a simulated hostile agent, with a fake token, on the same
# runner image the factory uses. No secrets. The part that needs a model (the
# agent's commands inside Claude Code's own sandbox) is checked by a probe run
# of the factory instead.
name: Factory sandbox

on:
  pull_request:
    paths:
      - .github/workflows/factory.yml
      - .github/workflows/factory-sandbox.yml
      - scripts/factory/sandbox.sh
      - scripts/factory/sandbox-test.sh
      - scripts/factory/secret-scan.mjs
  workflow_dispatch:

permissions: {}

concurrency:
  group: factory-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Harden runner (audit network egress, SHA-517)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install bubblewrap and socat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat

      - name: Run the sandbox checks
        run: bash scripts/factory/sandbox-test.sh
