name: Factory

# Turns one Linear ticket into a PR (SHA-524), fixes that PR when CI fails
# (SHA-536), and runs one round on CodeRabbit's findings (SHA-570). Started
# by hand for a new ticket; factory-followup.yml starts the fix runs (pr
# set) and the review round (pr set, round=review).
#
#   prepare  holds the Linear key: checks the ticket and writes ticket.md.
#            New run: picks the model and branch, moves the ticket to In
#            Progress. Fix run: also writes pr.md and ci-failure.md, or for
#            the review round pr.md and review-findings.md.
#   work     runs Claude Code with the playbook (.claude/skills/factory). No
#            Linear key, no write token: its only output is an artifact with
#            pr.md or blocked.md, a git bundle, and on the review round
#            review-replies.json.
#   local-review  new runs that end in pr.md: runs the CodeRabbit CLI on the
#            branch, on its own runner, and adds the result to pr.md (SHA-659).
#            The only job that holds the CodeRabbit key; it never runs the agent.
#   review-fix    when the local review found anything at Minor or above: one
#            more agent pass with local-review.md, then the outcome replaces
#            the work job's.
#   deliver  holds the Linear key and the factory app token. New run: pushes
#            the branch and opens a draft PR. Fix run: pushes to the PR branch
#            and updates the description. Or comments and moves the ticket to
#            Blocked. Review round: also posts the agent's replies on
#            CodeRabbit's threads, posts the done marker and asks
#            factory-followup.yml to decide again.
#
# The off switch is the FACTORY_ENABLED repo variable ("true" to run).
#
# Setup: the `factory` environment (main only) holds CLAUDE_CODE_OAUTH_TOKEN,
# LINEAR_API_KEY, FACTORY_APP_PRIVATE_KEY and CODERABBIT_API_KEY. Repo variables FACTORY_APP_CLIENT_ID
# and FACTORY_APP_SLUG name the factory GitHub App (contents and pull requests
# read/write, installed on this repo only).

# The ticket in the run name lets the Factory log report read it back.
run-name: Factory ${{ inputs.ticket }}${{ inputs.pr != '' && (inputs.round == 'review' && ' review fix' || ' fix') || '' }}

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Linear ticket ID (for example SHA-196)
        required: true
        type: string
      pr:
        description: Fix run only (set by factory-followup.yml). The factory PR to fix.
        required: false
        type: string
        default: ''
      attempt:
        description: Fix run only. Which fix attempt this is.
        required: false
        type: string
        default: ''
      model:
        description: Fix run only. Model override (the final attempt for a Sonnet ticket uses opus).
        required: false
        type: string
        default: ''
      round:
        description: Fix run only. "review" for the CodeRabbit review round; empty for a CI fix.
        required: false
        type: string
        default: ''

permissions: {}

# New-ticket runs go one at a time, so two tickets can't both pass the
# open-PR cap before either opens its PR. A concurrency group holds only one
# pending run, so fix runs get a group per PR: a fix run waiting behind a new
# ticket would otherwise be dropped when the next run queues.
concurrency:
  group: ${{ inputs.pr != '' && format('factory-fix-{0}', inputs.pr) || 'factory' }}
  cancel-in-progress: false

env:
  CLAUDE_CODE_VERSION: 2.1.316
  # The local review's CLI, pinned with the SHA-256 of its linux-x64 zip
  # (from the release's SHA256SUMS). Update both together.
  CODERABBIT_VERSION: 0.9.7
  CODERABBIT_SHA256: 1382d81b6b98bfbde6e7afbd529c3ab1f3154cbb6cbdf5d8beb388318ab59c5c

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: factory
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read # job logs for ci-failure.md
    outputs:
      run: ${{ steps.prepare.outputs.run }}
      model: ${{ steps.prepare.outputs.model }}
      branch: ${{ steps.prepare.outputs.branch || steps.fix.outputs.branch }}
      base: ${{ steps.fix.outputs.base || 'main' }}
      labels: ${{ steps.prepare.outputs.labels }}
      resume: ${{ steps.saved.outputs.resume }}
    steps:
      - name: Harden runner (audit network egress, SHA-517)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check the ticket and write ticket.md
        id: prepare
        env:
          TICKET: ${{ inputs.ticket }}
          FIX_PR: ${{ inputs.pr }}
          MODEL_OVERRIDE: ${{ inputs.model }}
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          FACTORY_ENABLED: ${{ vars.FACTORY_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$FIX_PR" ]; then
            node scripts/factory/factory.mjs prepare-fix "$TICKET" "$RUNNER_TEMP/factory"
          else
            OPEN_FACTORY_PRS=$(gh pr list --repo "$GITHUB_REPOSITORY" --label factory --state open --json number --jq length)
            export OPEN_FACTORY_PRS
            node scripts/factory/factory.mjs prepare "$TICKET" "$RUNNER_TEMP/factory"
          fi

      # A new run picks up where an earlier run of this ticket stopped, if
      # deliver saved that run's work to a factory-saved/ branch.
      - name: Find saved work from an earlier run
        id: saved
        if: inputs.pr == '' && steps.prepare.outputs.run == 'true'
        env:
          TICKET: ${{ inputs.ticket }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/factory-saved/$TICKET-" \
            --jq '.[].ref' > "$RUNNER_TEMP/saved-refs.txt"
          node scripts/factory/factory.mjs saved-branch "$TICKET" "$RUNNER_TEMP/saved-refs.txt"

      - name: Fix run - write pr.md and ci-failure.md or review-findings.md
        id: fix
        if: inputs.pr != '' && steps.prepare.outputs.run == 'true'
        env:
          FIX_PR: ${{ inputs.pr }}
          ROUND: ${{ inputs.round }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$ROUND" = review ]; then
            node scripts/factory/review.mjs findings "$FIX_PR" "$RUNNER_TEMP/factory"
          else
            node scripts/factory/ci-failure.mjs "$FIX_PR" "$RUNNER_TEMP/factory"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.prepare.outputs.run == 'true'
        with:
          name: factory-ticket
          path: ${{ runner.temp }}/factory/
          retention-days: 7

  # A fix run that doesn't get past prepare (off switch, ticket status, an
  # API error) would leave the PR red with its marker posted and nothing
  # acting on it. Block it with the reason.
  fix-not-started:
    needs: prepare
    if: always() && inputs.pr != '' && needs.prepare.outputs.run != 'true'
    runs-on: ubuntu-latest
    environment: factory
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit network egress, SHA-517)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Mint factory app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      - name: Block the ticket
        env:
          TICKET: ${{ inputs.ticket }}
          FIX_PR: ${{ inputs.pr }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf 'The factory fix run did not start (prepare: %s). See %s\n' "$PREPARE_RESULT" "$RUN_URL" > "$RUNNER_TEMP/blocked.md"
          gh pr edit "$FIX_PR" --repo "$GITHUB_REPOSITORY" --add-label factory-blocked || true
          node scripts/factory/factory.mjs blocked "$TICKET" "$RUNNER_TEMP/blocked.md"

  work:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: factory
    timeout-minutes: 60
    permissions:
      contents: read
    # The commits the output scan checks: everything this run adds.
    env:
      SCAN_BASE: ${{ needs.prepare.outputs.base }}
    outputs:
      base: ${{ steps.base.outputs.sha }}
      deliver: ${{ steps.package.outputs.deliver }}
    steps:
      - name: Harden runner (audit network egress, SHA-517)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # A new run works on main. A fix run works on the PR branch; the scope
      # lock keeps factory PRs from changing CLAUDE.md, AGENTS.md or .claude/,
      # so the branch's instructions are main's as of the branch point.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr != '' && needs.prepare.outputs.branch || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      # Recorded before the agent runs, for the local review and its fix pass.
      - name: Record the base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # A fix run's checkout, and review-fix's, is the factory's own branch:
      # install it without running its scripts, and don't build it (SHA-660,
      # see the playbook step). The agent can build inside its sandbox.
      - &install
        name: Install and build
        env:
          AGENT_BRANCH: ${{ inputs.pr != '' || github.job == 'review-fix' }}
        run: |
          if [ "$AGENT_BRANCH" = true ]; then
            npm ci --ignore-scripts
          else
            npm ci
            npm run build -w seekstone
          fi
          # From outside the checkout, so its .npmrc doesn't apply.
          (cd "$RUNNER_TEMP" && npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}")
          # The agent's sandbox needs bubblewrap and socat. Docker isn't used
          # here, and its socket would be a way out of the sandbox.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat
          sudo systemctl stop docker.socket docker.service 2>/dev/null || true
          sudo rm -f /run/docker.sock

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-ticket
          path: ${{ runner.temp }}/factory

      - name: Set the commit identity
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ vars.FACTORY_APP_SLUG }}
        run: |
          id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"

      # Start the branch from the saved work and bring it up to date with
      # main. resume.md tells the agent what it's starting from.
      - name: Start from saved work
        if: needs.prepare.outputs.resume != ''
        env:
          FACTORY_DIR: ${{ runner.temp }}/factory
          RESUME: ${{ needs.prepare.outputs.resume }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          git switch -c "$BRANCH" "origin/$RESUME"
          if git merge --no-edit main; then
            merged="main is merged in, so the branch is up to date."
          else
            git merge --abort
            merged="Merging main into it conflicted, so the branch is still on an older main. Merge main yourself and resolve the conflicts first."
          fi
          cat > "$FACTORY_DIR/resume.md" <<EOF
          An earlier factory run of this ticket stopped without a PR. Its work was saved on
          \`$RESUME\`, and \`$BRANCH\` is checked out starting from it. $merged

          The ticket may have changed since that run (for example, split into smaller tickets).
          Review the earlier commits (\`git log main..HEAD\`, \`git diff main\`) against the ticket
          as it reads now. Keep what fits, and change or remove what doesn't. Stay on this branch;
          don't create it again.
          EOF
          echo "::notice::resuming from $RESUME"

      # The output scan after the agent checks for the token without holding
      # it: any step after the agent's could be tampered with by the agent.
      # This step runs before the agent and keeps only the token's SHA-256
      # and length (SHA-660). review-fix runs it too.
      - &fingerprint-token
        name: Fingerprint the token
        id: fingerprint
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export LC_ALL=C
          re='^[A-Za-z0-9._~+/=-]{16,}$'
          if ! [[ "$TOKEN" =~ $re ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is missing or has characters the output scan doesn't handle"
            exit 1
          fi
          echo "sha256=$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "length=${#TOKEN}" >> "$GITHUB_OUTPUT"

      # The steps after the agent mustn't run anything the agent could have
      # changed (SHA-660). Before it starts, keep the factory scripts from
      # this workflow's own commit and the repo's git config, outside the
      # folders the agent can write to.
      - &keep-trusted
        name: Keep trusted copies for after the agent
        run: |
          trusted="$RUNNER_TEMP/trusted"
          mkdir -p "$trusted"
          GIT_NO_REPLACE_OBJECTS=1 git archive "$GITHUB_SHA" scripts/factory scripts/factory-ticket.mjs |
            tar -x -C "$trusted"
          cp .git/config "$trusted/git-config"

      # Under the job's 60 minutes, so the packaging steps below still run
      # and save the work when the agent runs long. review-fix runs this same
      # step (a YAML alias), so the two passes can't drift apart.
      #
      # Keeping the token from the agent (SHA-660). This is the only step that
      # holds it, and nothing from the checkout runs in it: the agent can
      # change the checkout. Inside the run:
      # - Every command the agent runs is sandboxed (bubblewrap, with its own
      #   PID namespace and /proc), with no network, and can write only to the
      #   checkout and $FACTORY_DIR. The sandbox has to start or the run
      #   fails; nothing may run outside it. CLAUDE_CODE_SUBPROCESS_ENV_SCRUB
      #   also strips the token from the commands' environment.
      # - Claude Code's own file tools can't read or write outside the
      #   checkout and $FACTORY_DIR, or write .git.
      # - Only these flags configure the run: no project settings, hooks or
      #   MCP servers from the checkout.
      # The step's result is checked in the next step, without the token.
      - &run-playbook
        name: Run the playbook
        id: agent
        timeout-minutes: 50
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          FACTORY_DIR: ${{ runner.temp }}/factory
          MODEL: ${{ needs.prepare.outputs.model }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          TICKET: ${{ inputs.ticket }}
          ATTEMPT: ${{ inputs.attempt }}
          TRANSCRIPT: ${{ runner.temp }}/transcript/transcript.jsonl
        run: |
          mkdir -p "$(dirname "$TRANSCRIPT")"
          if [ -f "$FACTORY_DIR/review-findings.md" ]; then
            prompt="Follow the factory playbook in .claude/skills/factory/SKILL.md for ticket ${TICKET}.
          This is the review round on the existing branch ${BRANCH}, which is checked out.
          The ticket is in ${FACTORY_DIR}/ticket.md, CodeRabbit's open findings in
          ${FACTORY_DIR}/review-findings.md, and the current PR description in ${FACTORY_DIR}/pr.md."
          elif [ -f "$FACTORY_DIR/ci-failure.md" ]; then
            prompt="Follow the factory playbook in .claude/skills/factory/SKILL.md for ticket ${TICKET}.
          This is CI-fix attempt ${ATTEMPT} on the existing branch ${BRANCH}, which is checked out.
          The ticket is in ${FACTORY_DIR}/ticket.md, the failing checks in ${FACTORY_DIR}/ci-failure.md,
          and the current PR description in ${FACTORY_DIR}/pr.md."
          elif [ -f "$FACTORY_DIR/local-review.md" ]; then
            prompt="Follow the factory playbook in .claude/skills/factory/SKILL.md for ticket ${TICKET}.
          This is the local review pass on the branch ${BRANCH}, which is checked out.
          The ticket is in ${FACTORY_DIR}/ticket.md, CodeRabbit's local findings in
          ${FACTORY_DIR}/local-review.md, and the PR description you wrote in ${FACTORY_DIR}/pr.md."
          else
            prompt="Follow the factory playbook in .claude/skills/factory/SKILL.md for ticket ${TICKET}.
          The ticket is in ${FACTORY_DIR}/ticket.md. Use the branch name ${BRANCH}."
            if [ -f "$FACTORY_DIR/resume.md" ]; then
              prompt="${prompt}
          This run continues earlier saved work: read ${FACTORY_DIR}/resume.md before you start."
            fi
          fi
          prompt="${prompt}
          Hooks are off in this run, so nothing formats files for you: run npm run format before each commit."
          settings=$(jq -n --arg factory "$FACTORY_DIR" --arg git "$PWD/.git" '{
            attribution: { commit: "", pr: "" },
            includeCoAuthoredBy: false,
            disableAllHooks: true,
            permissions: {
              blockReadsOutsideWorkingDirectories: true,
              blockWritesOutsideWorkingDirectories: true,
              deny: ["Read(//proc/**)", "Edit(/\($git)/**)"]
            },
            sandbox: {
              enabled: true,
              failIfUnavailable: true,
              allowUnsandboxedCommands: false,
              autoAllowBashIfSandboxed: false,
              filesystem: { allowWrite: [$factory] },
              network: { allowedDomains: [], allowLocalBinding: true }
            }
          }')
          claude -p "$prompt" \
            --model "$MODEL" \
            --permission-mode acceptEdits \
            --setting-sources user \
            --strict-mcp-config \
            --add-dir "$FACTORY_DIR" \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" "TodoWrite" \
              "Bash(npm test)" "Bash(npm test *)" "Bash(npm run *)" "Bash(npm ci)" \
              "Bash(npx vitest *)" "Bash(npx tsc *)" "Bash(npx biome *)" "Bash(npx changeset*)" \
              "Bash(node scripts/*)" "Bash(git *)" "Bash(ls *)" "Bash(cat *)" "Bash(rm ${FACTORY_DIR}/*)" \
            --disallowedTools "WebFetch" "WebSearch" "Bash(git push*)" "Bash(curl *)" "Bash(wget *)" \
            --settings "$settings" \
            --output-format stream-json --verbose > "$TRANSCRIPT"

      # Runs without the token, from the trusted copy of the scripts. Out of
      # Max allowance (or switched to paid overage): drop any partial result
      # and hand back quota.md, so deliver can requeue. Otherwise a failed
      # agent step fails the job, as it did before the token moved out.
      - &agent-result
        name: Check the agent's result
        id: result
        if: always() && steps.agent.outcome != 'skipped'
        env:
          FACTORY_DIR: ${{ runner.temp }}/factory
          TRANSCRIPT: ${{ runner.temp }}/transcript/transcript.jsonl
          OUTCOME: ${{ steps.agent.outcome }}
        run: |
          # The agent's closing summary, for the run log.
          jq -r 'select(.type == "result") | .result // empty' "$TRANSCRIPT" || true
          if node "$RUNNER_TEMP/trusted/scripts/factory/factory.mjs" quota "$TRANSCRIPT"; then
            echo "::warning::the Max allowance ran out during this run"
            rm -f "$FACTORY_DIR/pr.md" "$FACTORY_DIR/blocked.md"
            echo "The Max allowance ran out during the run." > "$FACTORY_DIR/quota.md"
            exit 0
          fi
          if [ "$OUTCOME" != success ]; then
            echo "::error::the agent step ended with '$OUTCOME'"
            exit 1
          fi

      # Before git runs outside the sandbox again: put back the git config
      # from before the agent (a hook, filter or fsmonitor the agent set would
      # run here), turn hooks off, and drop the empty placeholder files the
      # sandbox creates so git add -A doesn't commit them (SHA-660).
      - &restore-git
        name: Restore the git config
        if: always() && steps.agent.outcome != 'skipped'
        run: |
          cp "$RUNNER_TEMP/trusted/git-config" .git/config
          git config core.hooksPath /dev/null
          git ls-files --others --exclude-standard -z -- .mcp.json .claude .vscode .idea |
            while IFS= read -r -d '' f; do
              if [ -f "$f" ] && [ ! -s "$f" ]; then rm -f -- "$f"; fi
            done

      # Runs whatever happened above. The agent's work is always bundled, so
      # deliver can save it to a branch when no PR comes out of the run: a
      # block, the allowance running out, a timeout or a crash.
      - name: Package the result
        id: package
        if: always()
        env:
          FACTORY_DIR: ${{ runner.temp }}/factory
          BASE: ${{ needs.prepare.outputs.base }}
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          mkdir -p "$FACTORY_DIR"
          delivering=false
          if [ -f "$FACTORY_DIR/pr.md" ] && [ ! -f "$FACTORY_DIR/blocked.md" ] && [ ! -f "$FACTORY_DIR/quota.md" ]; then
            delivering=true
          fi
          # Changes the agent didn't commit go into one last commit, unless
          # this run is opening a PR (that PR holds only what the agent committed).
          if [ "$delivering" = false ] && [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -q --no-verify -m "wip(factory): uncommitted changes when the run stopped" ||
              echo "::warning::could not commit the uncommitted changes"
          fi
          ahead=$(git rev-list --count "$BASE..HEAD" 2>/dev/null || echo 0)
          if [ "$ahead" -gt 0 ]; then
            git bundle create "$FACTORY_DIR/work.bundle" "$BASE..HEAD"
            echo "$ahead new commit(s) on $(git branch --show-current)"
          fi
          if [ -f "$FACTORY_DIR/quota.md" ]; then exit 0; fi
          # blocked.md wins over pr.md. A fix run starts with pr.md already
          # written, and the agent's sandbox can't delete files, so an agent
          # that stops after writing pr.md leaves both behind.
          if [ -f "$FACTORY_DIR/blocked.md" ]; then
            if [ -f "$FACTORY_DIR/pr.md" ]; then
              echo "::notice::blocked.md and pr.md both present; using blocked.md"
              rm -f "$FACTORY_DIR/pr.md"
            fi
            exit 0
          fi
          if [ ! -f "$FACTORY_DIR/pr.md" ]; then
            echo "::error::the agent left neither pr.md nor blocked.md"; exit 1
          fi
          # The review round may only reply, with nothing to commit.
          if [ "$ahead" -eq 0 ] && [ ! -f "$FACTORY_DIR/review-findings.md" ]; then
            echo "::error::pr.md but no new commits"; exit 1
          fi
          echo "deliver=true" >> "$GITHUB_OUTPUT"

      # Everything this job publishes passes this check first: the transcript
      # and $FACTORY_DIR as artifacts, and through deliver the PR, the pushed
      # branch and the Linear comment. It looks for the token by its
      # fingerprint, so this step never holds it, and the scanner comes from
      # the trusted copy. On a hit, nothing is published (SHA-660).
      - &scan-outputs
        name: Check the outputs for the token
        id: scan
        if: always() && steps.fingerprint.outcome == 'success'
        env: &scan-env
          SECRET_SHA256: ${{ steps.fingerprint.outputs.sha256 }}
          SECRET_LENGTH: ${{ steps.fingerprint.outputs.length }}
          FACTORY_DIR: ${{ runner.temp }}/factory
          BASE: ${{ env.SCAN_BASE }}
          GIT_NO_REPLACE_OBJECTS: '1'
        run: &scan-run |
          set -o pipefail
          # The new commits, trees and blobs, uncompressed, then every file
          # that will be uploaded.
          if ! git rev-list --objects "$BASE..HEAD" | cut -d' ' -f1 | git cat-file --batch |
            node "$RUNNER_TEMP/trusted/scripts/factory/secret-scan.mjs" \
              "$RUNNER_TEMP/transcript" "$FACTORY_DIR" "$RUNNER_TEMP/fix-pass" -; then
            rm -rf "$RUNNER_TEMP/transcript" "$FACTORY_DIR" "$RUNNER_TEMP/fix-pass"
            echo "::error::nothing from this job is published. If the scan found the token, rotate CLAUDE_CODE_OAUTH_TOKEN now."
            exit 1
          fi

      # The full transcript (every tool call and its output), so a run can be
      # audited after the fact.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan.outcome == 'success'
        with:
          name: factory-transcript
          path: ${{ runner.temp }}/transcript/
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan.outcome == 'success'
        with:
          if-no-files-found: ignore
          name: factory-outcome
          path: ${{ runner.temp }}/factory/
          retention-days: 7

  # The CodeRabbit CLI reviews the branch before the PR opens. This job holds
  # the CodeRabbit key and runs on its own runner: the agent can run any code
  # in the work job (npm scripts, tests), and a process it leaves behind would
  # outlive its step, so no step of the work job can hold a key the agent
  # mustn't see. Nothing here runs code from the agent's branch: the scripts
  # come from the base commit, and the CLI only reads the branch.
  local-review:
    needs: [prepare, work]
    if: inputs.pr == '' && needs.work.outputs.deliver == 'true'
    runs-on: ubuntu-latest
    environment: factory
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      fix: ${{ steps.report.outputs.fix }}
    steps:
      - name: Harden runner (audit network egress, SHA-517)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.work.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-outcome
          path: ${{ runner.temp }}/factory

      # In a separate worktree, so this checkout (and the script that reads
      # the review) stays at the base commit.
      - name: Check out the branch to review
        id: src
        continue-on-error: true
        env:
          FACTORY_DIR: ${{ runner.temp }}/factory
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          git branch main HEAD
          git fetch "$FACTORY_DIR/work.bundle" "HEAD:refs/heads/$BRANCH"
          git worktree add "$RUNNER_TEMP/review-src" "$BRANCH"

      - name: Install the CodeRabbit CLI
        id: install
        if: steps.src.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ runner.temp }}
        run: |
          mkdir coderabbit && cd coderabbit
          curl -fsSL --retry 3 -o cli.zip \
            "https://cli.coderabbit.ai/releases/${CODERABBIT_VERSION}/coderabbit-linux-x64.zip"
          echo "${CODERABBIT_SHA256}  cli.zip" | sha256sum --check --strict
          unzip -q cli.zip coderabbit
          ./coderabbit --version

      # The key goes on the command line (the CLI doesn't store a key given
      # that way) and HOME is a scratch directory, removed afterwards. One
      # review per run, never --use-credits: when the included allowance is
      # used up the CLI refuses, and the run goes on without the review.
      - name: Review the branch
        id: review
        if: steps.install.outcome == 'success'
        working-directory: ${{ runner.temp }}/review-src
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
          HOME: ${{ runner.temp }}/coderabbit-home
        run: |
          if [ -z "$CODERABBIT_API_KEY" ]; then
            echo "status=nokey" >> "$GITHUB_OUTPUT"; exit 0
          fi
          mkdir -p "$HOME"
          out="$RUNNER_TEMP/local-review.jsonl"
          status=0
          timeout 15m "$RUNNER_TEMP/coderabbit/coderabbit" review --agent --deep --base main \
            --api-key "$CODERABBIT_API_KEY" > "$out" || status=$?
          rm -rf "$HOME"
          # The review text goes into pr.md and an artifact, which are public.
          if grep -qF "$CODERABBIT_API_KEY" "$out"; then
            : > "$out"
            status=leak
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Add the review to pr.md
        id: report
        env:
          FACTORY_DIR: ${{ runner.temp }}/factory
          SRC: ${{ steps.src.outcome }}
          INSTALLED: ${{ steps.install.outcome }}
          STATUS: ${{ steps.review.outputs.status }}
        run: |
          skip() { node scripts/factory/local-review.mjs skip "$FACTORY_DIR" "$1"; }
          if [ "$SRC" != success ]; then
            skip "could not check out the branch to review"
          elif [ "$INSTALLED" != success ]; then
            skip "could not install CodeRabbit CLI $CODERABBIT_VERSION (download or checksum failed)"
          elif [ "$STATUS" = nokey ]; then
            skip "the CODERABBIT_API_KEY secret is not set"
          elif [ "$STATUS" = leak ]; then
            skip "the CLI output contained the API key, so it was thrown away"
          elif [ -z "$STATUS" ]; then
            skip "the review step failed"
          else
            node scripts/factory/local-review.mjs report "$FACTORY_DIR" "$RUNNER_TEMP/local-review.jsonl" "$STATUS"
          fi

      # Each pass uploads under its own name, so a failed upload never removes
      # the work job's factory-outcome. Deliver takes the newest that arrived.
      # overwrite only replaces this same name from an earlier attempt.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-outcome-reviewed
          path: ${{ runner.temp }}/factory/
          retention-days: 7
          overwrite: true

  # The agent's pass over the local review's findings, on a fresh runner
  # without the CodeRabbit key. Its outcome replaces the work job's only when
  # the pass ends in pr.md or blocked.md; otherwise (a timeout, a crash, the
  # allowance running out) the first pass is delivered, and pr.md already
  # lists the findings as not addressed.
  review-fix:
    needs: [prepare, work, local-review]
    if: needs.local-review.result == 'success' && needs.local-review.outputs.fix == 'true'
    runs-on: ubuntu-latest
    environment: factory
    # The agent step's own 50 minutes, plus setup and the steps that keep an
    # unfinished pass.
    timeout-minutes: 75
    permissions:
      contents: read
    # The commits the output scan checks: the first pass's and this pass's.
    env:
      SCAN_BASE: ${{ needs.work.outputs.base }}
    # Job outputs come from the latest attempt, so a re-run that didn't
    # upload never delivers an earlier attempt's factory-outcome-fixed or
    # factory-fix-pass.
    outputs:
      fixed: ${{ steps.fixed-upload.outcome }}
      fix-pass: ${{ steps.fix-pass-upload.outcome }}
    steps:
      - name: Harden runner (audit network egress, SHA-517)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.work.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-outcome-reviewed
          path: ${{ runner.temp }}/factory

      - name: Check out the branch
        env:
          FACTORY_DIR: ${{ runner.temp }}/factory
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          git branch main HEAD
          git fetch "$FACTORY_DIR/work.bundle" "HEAD:refs/heads/$BRANCH"
          git switch "$BRANCH"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # The checkout is the factory's branch, so the same rules as a fix run.
      - *install

      - name: Set the commit identity
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ vars.FACTORY_APP_SLUG }}
        run: |
          id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${id}+${APP_SLUG}[bot]@users.noreply.github.com"

      # The fix pass must rewrite pr.md (or write blocked.md) to count. Without
      # this, the first pass's pr.md would satisfy the check below even when
      # the agent committed half a fix and stopped.
      - name: Record the first pass's pr.md
        id: first
        env:
          FACTORY_DIR: ${{ runner.temp }}/factory
        run: |
          echo "sha=$(sha256sum "$FACTORY_DIR/pr.md" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - *fingerprint-token
      - *keep-trusted
      - *run-playbook
      - *agent-result
      - *restore-git

      - name: Package the result
        id: package
        if: steps.result.outcome == 'success'
        env:
          FACTORY_DIR: ${{ runner.temp }}/factory
          BASE: ${{ needs.work.outputs.base }}
          FIRST_SHA: ${{ steps.first.outputs.sha }}
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          if [ -f "$FACTORY_DIR/quota.md" ]; then
            echo "::warning::the Max allowance ran out in the fix pass; delivering the first pass"
            exit 0
          fi
          if [ -f "$FACTORY_DIR/blocked.md" ]; then
            rm -f "$FACTORY_DIR/pr.md"
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -q --no-verify -m "wip(factory): uncommitted changes when the run stopped" ||
                echo "::warning::could not commit the uncommitted changes"
            fi
          elif [ ! -f "$FACTORY_DIR/pr.md" ] ||
            [ "$(sha256sum "$FACTORY_DIR/pr.md" | cut -d' ' -f1)" = "$FIRST_SHA" ]; then
            echo "::warning::the fix pass did not rewrite pr.md or write blocked.md; delivering the first pass"
            exit 0
          fi
          git bundle create "$FACTORY_DIR/work.bundle" "$BASE..HEAD"
          echo "upload=true" >> "$GITHUB_OUTPUT"

      - *scan-outputs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan.outcome == 'success'
        with:
          name: factory-transcript-local-review
          path: ${{ runner.temp }}/transcript/
          retention-days: 14
          overwrite: true
          if-no-files-found: ignore

      - id: fixed-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.package.outputs.upload == 'true' && steps.scan.outcome == 'success'
        with:
          name: factory-outcome-fixed
          path: ${{ runner.temp }}/factory/
          retention-days: 7
          overwrite: true

      # When the first pass is delivered instead (the fix pass failed, ran
      # out of allowance, didn't rewrite pr.md, or its outcome didn't
      # upload), keep what the fix pass did. Deliver pushes it to its own
      # saved branch.
      - name: Keep the unfinished fix pass
        id: unfinished
        if: >-
          always() && steps.first.outcome == 'success' &&
          steps.fixed-upload.outcome != 'success' && steps.scan.outcome != 'failure'
        env:
          BASE: ${{ needs.work.outputs.base }}
          FIRST_HEAD: ${{ steps.first.outputs.head }}
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -q --no-verify -m "wip(factory): uncommitted changes when the fix pass stopped" ||
              echo "::warning::could not commit the fix pass's uncommitted changes"
          fi
          if [ "$(git rev-parse HEAD)" = "$FIRST_HEAD" ]; then exit 0; fi
          mkdir -p "$RUNNER_TEMP/fix-pass"
          git bundle create "$RUNNER_TEMP/fix-pass/fix-pass.bundle" "$BASE..HEAD"
          echo "saved=true" >> "$GITHUB_OUTPUT"

      # The step above may have added a commit, so check again.
      - name: Check the unfinished fix pass for the token
        id: scan-fix-pass
        if: always() && steps.unfinished.outputs.saved == 'true'
        env: *scan-env
        run: *scan-run

      - id: fix-pass-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.unfinished.outputs.saved == 'true' && steps.scan-fix-pass.outcome == 'success'
        with:
          name: factory-fix-pass
          path: ${{ runner.temp }}/fix-pass/
          retention-days: 7
          overwrite: true

  deliver:
    needs: [prepare, work, local-review, review-fix]
    if: always() && needs.prepare.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: factory
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # check whether the PR was opened, on failure
      actions: write # the review round asks factory-followup.yml to decide again
    steps:
      - name: Harden runner (audit network egress, SHA-517)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Fetched even when the work job failed, so its work can be saved.
      - id: download-outcome
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: factory-outcome
          path: ${{ runner.temp }}/factory

      - id: download-reviewed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.local-review.result == 'success'
        continue-on-error: true
        with:
          name: factory-outcome-reviewed
          path: ${{ runner.temp }}/outcome-reviewed

      - id: download-fixed
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.review-fix.result == 'success' && needs.review-fix.outputs.fixed == 'success'
        continue-on-error: true
        with:
          name: factory-outcome-fixed
          path: ${{ runner.temp }}/outcome-fixed

      # The newest complete outcome wins: the fix pass's, then the local
      # review's, then the work job's.
      # Only a download that succeeded counts: a failed one can leave files.
      - name: Use the newest outcome
        env:
          FIXED: ${{ steps.download-fixed.outcome }}
          REVIEWED: ${{ steps.download-reviewed.outcome }}
          FIRST: ${{ steps.download-outcome.outcome }}
        run: |
          if [ "$FIRST" != success ]; then rm -rf "$RUNNER_TEMP/factory"; fi
          for d in outcome-fixed outcome-reviewed; do
            ok="$REVIEWED"
            if [ "$d" = outcome-fixed ]; then ok="$FIXED"; fi
            if [ "$ok" != success ]; then continue; fi
            dir="$RUNNER_TEMP/$d"
            if [ -f "$dir/work.bundle" ] && { [ -f "$dir/pr.md" ] || [ -f "$dir/blocked.md" ]; }; then
              rm -rf "$RUNNER_TEMP/factory"
              mv "$dir" "$RUNNER_TEMP/factory"
              echo "::notice::delivering $d"
              break
            fi
          done

      # PRs opened with the default token don't trigger CI, so the factory
      # pushes and opens PRs as its own GitHub App (contents and pull
      # requests only; it can't change workflows).
      - name: Mint factory app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}

      # When the run won't open or update a PR, push its commits to their own
      # branch so nothing is lost, and note the branch in saved.md for the
      # ticket comment. No workflow runs on pushes to these branches.
      - name: Save the work to a branch
        env:
          WORK_RESULT: ${{ needs.work.result }}
          TICKET: ${{ inputs.ticket }}
          FACTORY_DIR: ${{ runner.temp }}/factory
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ ! -f "$FACTORY_DIR/work.bundle" ]; then exit 0; fi
          if [ "$WORK_RESULT" = success ] && [ -f "$FACTORY_DIR/pr.md" ] &&
             [ ! -f "$FACTORY_DIR/blocked.md" ] && [ ! -f "$FACTORY_DIR/quota.md" ]; then
            exit 0 # the PR step below pushes it
          fi
          saved="factory-saved/${TICKET}-${GITHUB_RUN_ID}"
          git fetch "$FACTORY_DIR/work.bundle" "HEAD:refs/heads/$saved"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$saved"
          printf '\nThe work from this run is saved on the branch [`%s`](%s/%s/tree/%s).\n' \
            "$saved" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$saved" > "$FACTORY_DIR/saved.md"
          echo "::notice::saved the run's work to $saved"

      - id: download-fix-pass
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.review-fix.result != 'skipped' && needs.review-fix.outputs.fix-pass == 'success'
        continue-on-error: true
        with:
          name: factory-fix-pass
          path: ${{ runner.temp }}/fix-pass

      # The fix pass's commits when the first pass was delivered instead.
      - name: Save the unfinished fix pass to a branch
        env:
          DOWNLOADED: ${{ steps.download-fix-pass.outcome }}
          TICKET: ${{ inputs.ticket }}
          FACTORY_DIR: ${{ runner.temp }}/factory
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bundle="$RUNNER_TEMP/fix-pass/fix-pass.bundle"
          if [ "$DOWNLOADED" != success ] || [ ! -f "$bundle" ]; then exit 0; fi
          saved="factory-saved/${TICKET}-${GITHUB_RUN_ID}-fix-pass"
          # Best effort: a failed save must not stop the first pass's PR.
          if ! { git fetch "$bundle" "HEAD:refs/heads/$saved" &&
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$saved"; }; then
            echo "::warning::could not save the unfinished fix pass; its bundle is in the factory-fix-pass artifact for 7 days"
            exit 0
          fi
          if [ -f "$FACTORY_DIR/pr.md" ]; then
            printf '\nThe unfinished fix pass is saved on the branch [`%s`](%s/%s/tree/%s).\n' \
              "$saved" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$saved" >> "$FACTORY_DIR/pr.md"
          fi
          echo "::notice::saved the unfinished fix pass to $saved"

      - name: The work job failed
        if: needs.work.result != 'success'
        env:
          WORK_RESULT: ${{ needs.work.result }}
        run: |
          echo "::error::the work job ended with '$WORK_RESULT'"
          exit 1

      # A new ticket goes back to Todo for a later night. A fix run can't
      # wait for another CI event (none will come), so it blocks instead.
      - name: Out of allowance
        id: quota
        env:
          TICKET: ${{ inputs.ticket }}
          FIX_PR: ${{ inputs.pr }}
          FACTORY_DIR: ${{ runner.temp }}/factory
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ ! -f "$FACTORY_DIR/quota.md" ]; then exit 0; fi
          echo "::notice::allowance ran out on $TICKET"
          if [ -f "$FACTORY_DIR/saved.md" ]; then cat "$FACTORY_DIR/saved.md" >> "$FACTORY_DIR/quota.md"; fi
          if [ -n "$FIX_PR" ]; then
            echo "Fix it by hand or re-run the factory once the allowance resets." >> "$FACTORY_DIR/quota.md"
            gh pr edit "$FIX_PR" --repo "$GITHUB_REPOSITORY" --add-label factory-blocked
            node scripts/factory/factory.mjs blocked "$TICKET" "$FACTORY_DIR/quota.md"
          else
            node scripts/factory/factory.mjs requeue "$TICKET" "$FACTORY_DIR/quota.md"
          fi
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Pass the agent's questions to Linear
        id: questions
        if: steps.quota.outputs.done != 'true'
        env:
          TICKET: ${{ inputs.ticket }}
          FIX_PR: ${{ inputs.pr }}
          FACTORY_DIR: ${{ runner.temp }}/factory
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -f "$FACTORY_DIR/blocked.md" ]; then
            if [ -f "$FACTORY_DIR/saved.md" ]; then cat "$FACTORY_DIR/saved.md" >> "$FACTORY_DIR/blocked.md"; fi
            node scripts/factory/factory.mjs blocked "$TICKET" "$FACTORY_DIR/blocked.md"
            if [ -n "$FIX_PR" ]; then
              gh pr edit "$FIX_PR" --repo "$GITHUB_REPOSITORY" --add-label factory-blocked
              gh pr comment "$FIX_PR" --repo "$GITHUB_REPOSITORY" --body-file "$FACTORY_DIR/blocked.md"
            fi
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the branch and open or update the PR
        if: steps.quota.outputs.done != 'true' && steps.questions.outputs.done != 'true'
        env:
          BRANCH: ${{ needs.prepare.outputs.branch }}
          PR_LABELS: ${{ needs.prepare.outputs.labels }}
          MODEL: ${{ needs.prepare.outputs.model }}
          FIX_PR: ${{ inputs.pr }}
          FACTORY_DIR: ${{ runner.temp }}/factory
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # No bundle only on a review round that just replied.
          if [ -f "$FACTORY_DIR/work.bundle" ]; then
            git fetch "$FACTORY_DIR/work.bundle" "HEAD:refs/heads/$BRANCH"
            # The token is passed to this one push, not stored in git config. A
            # fix run's bundle builds on the PR head, so this is a fast-forward.
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$BRANCH"
          fi
          title=$(head -n 1 "$FACTORY_DIR/pr.md")
          tail -n +2 "$FACTORY_DIR/pr.md" > "$FACTORY_DIR/body.md"
          # factory-followup.yml reads the model from here (a Sonnet ticket
          # gets a final Opus attempt).
          printf '\n<!-- factory-model %s -->\n' "$MODEL" >> "$FACTORY_DIR/body.md"
          if [ -n "$FIX_PR" ]; then
            gh pr edit "$FIX_PR" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$FACTORY_DIR/body.md"
          else
            # A draft until the required checks pass; factory-followup.yml
            # then marks it ready, which moves the ticket to In Review.
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --base main --head "$BRANCH" \
              --title "$title" --body-file "$FACTORY_DIR/body.md" \
              --label "$PR_LABELS" --reviewer "$GITHUB_REPOSITORY_OWNER"
          fi

      # After the push, so the follow-up never sees the done marker on the
      # old head. The agent has no GitHub token; its replies go out here, as
      # the factory app, and only on CodeRabbit threads that are still open.
      # A blocked round ends here too: the label stops the follow-up.
      - name: Finish the review round
        if: inputs.round == 'review' && steps.quota.outputs.done != 'true'
        env:
          FIX_PR: ${{ inputs.pr }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          FACTORY_DIR: ${{ runner.temp }}/factory
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISPATCH_TOKEN: ${{ github.token }}
        run: |
          node scripts/factory/review.mjs replies "$FIX_PR" "$FACTORY_DIR/review-replies.json"
          printf 'The factory review round finished.\n\n<!-- factory-review-done -->\n' > "$RUNNER_TEMP/done.md"
          gh pr comment "$FIX_PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/done.md"
          # With no new commit, no CI event would come to wake the follow-up.
          GH_TOKEN="$DISPATCH_TOKEN" gh workflow run factory-followup.yml --repo "$GITHUB_REPOSITORY" \
            --ref main -f branch="$BRANCH"

      # Any failure above would leave the ticket stuck: a new run's ticket in
      # In Progress (the Todo gate stops a retry), a fix run's PR red with
      # nothing left to start another fix. Block it with the run link, unless
      # a new run's PR did get opened.
      - name: Block the ticket on failure
        if: failure()
        env:
          TICKET: ${{ inputs.ticket }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          FIX_PR: ${{ inputs.pr }}
          FACTORY_DIR: ${{ runner.temp }}/factory
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$FIX_PR" ]; then
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
            if [ -n "$pr" ]; then
              echo "The PR was opened ($pr); leaving the ticket alone."
              exit 0
            fi
          fi
          # The PR step failed after the save step skipped this run's work:
          # save it now.
          if [ -f "$FACTORY_DIR/work.bundle" ] && [ ! -f "$FACTORY_DIR/saved.md" ]; then
            saved="factory-saved/${TICKET}-${GITHUB_RUN_ID}"
            if git fetch "$FACTORY_DIR/work.bundle" "HEAD:refs/heads/$saved" &&
               git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/heads/$saved"; then
              printf '\nThe work from this run is saved on the branch [`%s`](%s/%s/tree/%s).\n' \
                "$saved" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$saved" > "$FACTORY_DIR/saved.md"
            fi
          fi
          printf 'The factory run failed before it delivered a result. See %s\n' "$RUN_URL" > "$RUNNER_TEMP/failed.md"
          if [ -f "$FACTORY_DIR/saved.md" ]; then cat "$FACTORY_DIR/saved.md" >> "$RUNNER_TEMP/failed.md"; fi
          node scripts/factory/factory.mjs blocked "$TICKET" "$RUNNER_TEMP/failed.md"
          if [ -n "$FIX_PR" ]; then
            gh pr edit "$FIX_PR" --repo "$GITHUB_REPOSITORY" --add-label factory-blocked || true
          fi
