name: Review gate

# `review gate` passes only when CodeRabbit has approved the code that would
# merge, or a maintainer added the `review:override` label (SHA-569).
# CodeRabbit's own check run reports success whenever a review finishes,
# findings or not, so it can't block a merge by itself. Logic and the rules
# for drafts, the release PR and merges from main live in
# scripts/review-gate.mjs (tested); docs/QUALITY-GATES.md explains them.
#
# A CodeRabbit review comes from a GitHub App, so it triggers this workflow.
# The gate job only reads, which keeps fork PRs (read-only token) working.
# `clear-stale` is the one job that writes (it re-runs workflow runs), and it
# skips forks.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  gate:
    name: review gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner (audit network egress, SHA-517)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      # The script comes from the base commit, so editing it in a PR doesn't
      # change how that PR is judged. Full history, because the gate walks
      # the commits between CodeRabbit's approval and the head with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      # The PR head (fork commits included, through refs/pull) and the tip of
      # the base branch. The repo is public, so this fetch needs no token.
      - name: Fetch the PR head and the base branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" \
            "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"

      # Only the PR that adds the gate gets here: its base has no script yet.
      - name: Use the PR's gate script (first run only)
        run: |
          if [ ! -f scripts/review-gate.mjs ]; then
            git checkout refs/remotes/pull/head -- scripts/review-gate.mjs scripts/factory/github.mjs
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check CodeRabbit's review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: node scripts/review-gate.mjs

  # A push runs the gate before CodeRabbit has reviewed the new head, so that
  # run fails, as it should. When CodeRabbit approves, the review-event run
  # above passes, but the failed run stays on the commit and GitHub reports
  # the PR as failing until someone re-runs it (SHA-658). Re-run those failed
  # runs here: on the same head they now pass. A re-run keeps its original
  # pull_request event, so it never reaches this job and can't loop.
  clear-stale:
    name: re-run stale review gate
    needs: gate
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Harden runner (audit network egress, SHA-517)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Re-run failed gate runs on this head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          ids=$(gh run list --workflow review-gate.yml --commit "$HEAD_SHA" \
            --status failure --limit 20 --json databaseId --jq '.[].databaseId')
          for id in $ids; do
            [ "$id" = "$CURRENT_RUN" ] && continue
            echo "re-running failed review gate run $id"
            gh run rerun "$id" --failed || echo "::warning::could not re-run review gate run $id"
          done
